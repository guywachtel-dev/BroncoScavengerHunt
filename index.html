<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clue Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .clue {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
        }
        .error {
            color: red;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="message" class="error">No clue available.</div>
        <div id="clue" class="clue" style="display:none"></div>
    </div>

    <script>
        // Define the GUIDs and their corresponding clues
        const cluesMap = {"c2ca3b60-3d26-43a1-9d34-89c3f4d1fe2c":"This is the first clue;","613081b7-68d4-4a79-8556-35a0102c630a":"This is the second clue;","0493ae45-11de-4ed5-8483-6e6ad60e0b6e":"This is the third clue;","c366fe97-ef8e-4278-b26d-95f9e50b1c1f":"This is the nineteenth clue (jk, it's number 4);","4cc68c31-19a1-4b81-947b-8bd97e63978f":"This is the fifth clue;","64664c3c-5d33-4e68-b8d5-636fc0e1e65f":"This is the sixth clue;","3d0e88a8-0a47-4e00-82cb-ff4b083f97ef":"this is the seventh clue, and should appear on the second page;","ae299a7e-9cde-4f43-8d3b-aa8584a33323":"This is the eighth clue;","73f65cd5-c73d-4a3f-84a3-514e951a96ec":"This is the ninth clue;","331ef724-efde-4e79-8a6f-fb58c3119383":"This is the tenth clue;","0cc38b82-4ed3-494c-91cc-af3c496c2338":"This is the eleventh clue;","48187674-721e-45d3-ad13-b98e184c7f54":"This is the twelfth clue;","c3c93d09-032f-41ec-8081-b65d127f1dd3":"This is the thirteenth clue;"};

        // Function to get the GUID from the URL
        function getGUIDFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('guid');
        }

        // Main logic
        window.onload = function() {
            const guid = getGUIDFromURL();
            const messageDiv = document.getElementById("message");
            const clueDiv = document.getElementById("clue");

            if (guid && cluesMap[guid]) {
                // Show the corresponding clue
                clueDiv.textContent = cluesMap[guid];
                clueDiv.style.display = "block";
                messageDiv.style.display = "none"; // Hide the error message
            } else {
                messageDiv.textContent = "Invalid or missing GUID. Access denied.";
            }
        }
    </script>
</body>
</html>
