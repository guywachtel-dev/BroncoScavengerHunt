<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clue Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .clue {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
        }
        .error {
            color: red;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="message" class="error">No clue available.</div>
        <div id="clue" class="clue" style="display:none"></div>
    </div>

    <script>
        // Define the GUIDs and their corresponding clues
        const cluesMap = {"bcbb7638-f14a-4de9-a276-088636c2d108":"This is the first clue;","4ab0bc61-e293-40c4-9049-907bedce3829":"This is the second clue;","d654a72b-9df1-420f-9db7-f09db5b6ccb2":"This is the third clue;","6a223607-0ca2-45ac-bc2b-e6026bebedeb":"This is the nineteenth clue (jk, it's number 4);","3fd7b582-9f93-47e5-ae68-9170fb9a8fc1":"This is the fifth clue;","fea6e473-3898-415f-81b3-a3db96143263":"This is the sixth clue;","89cf0e62-34dd-426d-86d1-37b854aedb10":"this is the seventh clue, and should appear on the second page;","d55907b1-e276-40b0-af86-3e4a9a407bcc":"This is the eighth clue;","c40dea44-ba51-49dd-8a3e-f83049fffa43":"This is the ninth clue;","71f76684-1941-4c00-8e52-4440b15fa16f":"This is the tenth clue;","ff3aeb06-c97b-45b3-91bf-ea632ae1ffe1":"This is the eleventh clue;","7fa3ea31-a4a8-4316-8b5e-dba586b508ec":"This is the twelfth clue;","a2cd115b-ace3-4252-b1b2-8583d43c6d82":"This is the thirteenth clue;"};

        // Function to get the GUID from the URL
        function getGUIDFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('guid');
        }

        // Main logic
        window.onload = function() {
            const guid = getGUIDFromURL();
            const messageDiv = document.getElementById("message");
            const clueDiv = document.getElementById("clue");

            if (guid && cluesMap[guid]) {
                // Show the corresponding clue
                clueDiv.textContent = cluesMap[guid];
                clueDiv.style.display = "block";
                messageDiv.style.display = "none"; // Hide the error message
            } else {
                messageDiv.textContent = "Invalid or missing GUID. Access denied.";
            }
        }
    </script>
</body>
</html>
